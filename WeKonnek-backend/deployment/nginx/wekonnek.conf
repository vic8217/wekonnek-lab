server {

    server_name wapi.wekonnek.biz;

    auth_basic "WeKonnek Sandbox";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Must stay in sync with MEDIA_MAX_UPLOAD_MB and Multer's upload limit.
    client_max_body_size 10M;

    # Provider callbacks must bypass sandbox Basic Auth while the rest of the
    # API host remains protected. Application signature verification is still
    # mandatory for every request on this route.
    location ^~ /api/auth/oauth/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/payments/callbacks/paycools/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wapi.wekonnek.biz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wapi.wekonnek.biz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = wapi.wekonnek.biz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name wapi.wekonnek.biz;
    return 404; # managed by Certbot


}
