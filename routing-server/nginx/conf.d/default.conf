# ─── Main Server ────────────────────────────────────
# Start with HTTP-only. Switch to HTTPS after SSL setup.
server {
    # HTTP (initial setup — works without SSL certs)
    listen 80;
    server_name _;

    # ─── HTTPS (uncomment after SSL is set up) ──────
    # listen 443 ssl;
    # http2 on;
    # server_name route.yourdomain.com;
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # ─── API Key Extraction ─────────────────────────
    # Checks X-API-Key header first, then ?api_key= query param
    set $api_key "";
    if ($http_x_api_key) {
        set $api_key $http_x_api_key;
    }
    if ($arg_api_key) {
        set $api_key $arg_api_key;
    }

    # ─── Health (no auth required) ──────────────────
    location = /health {
        proxy_pass http://poi_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ready {
        proxy_pass http://poi_api/ready;
        proxy_set_header Host $host;
    }

    # ─── Routing (OSRM via POI API proxy) ──────────
    location /route/ {
        # Auth check — $valid_api_keys is "valid" if key is in the map
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key","hint":"Pass X-API-Key header or ?api_key= param"}';
        }

        limit_req zone=routing burst=20 nodelay;

        proxy_pass http://poi_api/route/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache routing results for 5 minutes
        proxy_cache routing_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── Nearby Search ──────────────────────────────
    location /nearby {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=api burst=30 nodelay;

        proxy_pass http://poi_api/nearby;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Reverse Geocoding ──────────────────────────
    location /reverse {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=api burst=30 nodelay;

        proxy_pass http://poi_api/reverse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Categories ─────────────────────────────────
    location /categories {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        proxy_pass http://poi_api/categories;
        proxy_set_header Host $host;

        # Cache for 1 hour
        proxy_cache categories_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── Distance Matrix ────────────────────────────
    location /matrix {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=routing burst=10 nodelay;

        proxy_pass http://poi_api/matrix;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache routing_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── Map Matching / Snap-to-Road ─────────────────
    location /match {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=routing burst=10 nodelay;

        proxy_pass http://poi_api/match;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Trip Optimization ───────────────────────────
    location /trip {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=routing burst=10 nodelay;

        proxy_pass http://poi_api/trip;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Forward Geocoding ───────────────────────────
    location /geocode {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=api burst=30 nodelay;

        proxy_pass http://poi_api/geocode;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache geocode_cache;
        proxy_cache_valid 200 30m;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── Autocomplete / Place Predictions ────────────
    location /autocomplete {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=api burst=50 nodelay;

        proxy_pass http://poi_api/autocomplete;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache geocode_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── Place Details ───────────────────────────────
    location /place/ {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=api burst=30 nodelay;

        proxy_pass http://poi_api/place/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Isochrone ───────────────────────────────────
    location /isochrone {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=routing burst=5 nodelay;

        proxy_pass http://poi_api/isochrone;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache isochrone_cache;
        proxy_cache_valid 200 15m;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── Elevation ───────────────────────────────────
    location /elevation {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=api burst=20 nodelay;

        proxy_pass http://poi_api/elevation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Swagger Docs (no auth) ──────────────────────
    location /docs {
        proxy_pass http://poi_api/docs;
        proxy_set_header Host $host;
    }

    # ─── Direct OSRM access (optional, advanced) ───
    location /osrm/ {
        if ($valid_api_keys != "valid") {
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=routing burst=10 nodelay;

        rewrite ^/osrm/(.*) /$1 break;
        proxy_pass http://osrm;
        proxy_set_header Host $host;
    }

    # ─── Service Info (root) ────────────────────────
    location / {
        return 200 '{"service":"WeKonnek Routing Server","version":"2.0.0","endpoints":{"routing":{"directions":"/route/v1/{profile}/{coordinates}","matrix":"/matrix","match":"/match","trip":"/trip"},"geocoding":{"forward":"/geocode?q=...","reverse":"/reverse?lat=...&lng=...","autocomplete":"/autocomplete?q=..."},"places":{"nearby":"/nearby?lat=...&lng=...","details":"/place/{id}","categories":"/categories"},"analysis":{"isochrone":"/isochrone?lat=...&lng=...&range=...","elevation":"/elevation?points=..."},"system":{"health":"/health","docs":"/docs"}},"profiles":["driving","walking","cycling","motorcycle"]}';
        add_header Content-Type application/json;
    }
}
