###############################################################################
#  WeKonnek Routing Gateway — Server Blocks
###############################################################################

# ─── Redirect HTTP → HTTPS (when SSL is enabled) ──
# Uncomment this block AFTER running ssl-setup.sh
# server {
#     listen 80;
#     server_name route.yourdomain.com;
#
#     # Let's Encrypt ACME challenge
