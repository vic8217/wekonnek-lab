###############################################################################
#  API Key Configuration
#  Add valid API keys here — one per line
#  Format: "api-key-value" "valid";
#  
#  The map sets $valid_api_keys = "valid" when $api_key matches a known key.
#  Nginx locations check: if ($valid_api_keys != "valid") { return 401; }
#
#  Usage: 
#    curl -H "X-API-Key: whp_routing_CHANGE_ME" https://route.yourdomain.com/...
#    or
#    curl https://route.yourdomain.com/nearby?api_key=whp_routing_CHANGE_ME&lat=...
###############################################################################

# Map: $api_key → $valid_api_keys
# If $api_key matches a listed key, $valid_api_keys becomes "valid"
map $api_key $valid_api_keys {
    default "";
    
    # ─── Default development key (CHANGE IN PRODUCTION!) ──
    "whp_routing_dev_key_change_me"  "valid";
    
    # ─── Production keys (uncomment & set real values) ────
    # "whp_backend_prod_XXXXXX"   "valid";
    # "whp_customer_app_XXXXXX"   "valid";
    # "whp_provider_app_XXXXXX"   "valid";
    # "whp_admin_portal_XXXXXX"   "valid";
}
