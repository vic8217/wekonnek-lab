###############################################################################
#  WeKonnek Routing Server — Nginx Configuration
#  Reverse proxy + SSL + API key authentication
###############################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # ─── Logging ──────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain;

    # ─── Rate limiting ────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=routing:10m rate=50r/s;

    # ─── Response cache ───────────────────────
    proxy_cache_path /var/cache/nginx/routing
        levels=1:2
        keys_zone=routing_cache:10m
        max_size=500m
        inactive=10m
        use_temp_path=off;

    proxy_cache_path /var/cache/nginx/categories
        levels=1:2
        keys_zone=categories_cache:5m
        max_size=50m
        inactive=1h
        use_temp_path=off;

    proxy_cache_path /var/cache/nginx/geocode
        levels=1:2
        keys_zone=geocode_cache:10m
        max_size=200m
        inactive=30m
        use_temp_path=off;

    proxy_cache_path /var/cache/nginx/isochrone
        levels=1:2
        keys_zone=isochrone_cache:5m
        max_size=200m
        inactive=15m
        use_temp_path=off;

    # ─── API Key validation ───────────────────
    include /etc/nginx/api_keys.conf;

    # ─── Upstream services ────────────────────
    upstream osrm {
        server osrm-backend:5000;
        keepalive 32;
    }

    upstream poi_api {
        server poi-api:3100;
        keepalive 16;
    }

    # ─── Server blocks ───────────────────────
    include /etc/nginx/conf.d/*.conf;
}
